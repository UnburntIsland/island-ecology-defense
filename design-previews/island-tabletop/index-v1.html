<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>島嶼生態保衛戰｜2.5D 代表畫面提案</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e7e9e3;color:#243d34;font:14px/1.5 system-ui,"Microsoft JhengHei",sans-serif}header{padding:16px 24px;background:#fcfaf3;border-bottom:1px solid #cbd0c5;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}p{margin:3px 0 0;color:#657066;font-size:12px}nav{display:flex;gap:6px;flex-wrap:wrap}button,a{font:inherit;border:1px solid #b9c2b4;border-radius:5px;background:transparent;color:inherit;padding:9px 15px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#2e5041;color:#fff;border-color:#2e5041}.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:12px}.bar span{font-size:12px;color:#59675d}.stage{display:flex;justify-content:center;padding:0 20px 24px;overflow:auto}iframe{border:1px solid #b4bcae;background:#e3e9db;flex:none;width:min(1440px,100%);height:calc(100dvh - 170px);min-height:540px;border-radius:8px}.mobile iframe{width:844px;height:390px;min-height:390px}.mobile{justify-content:flex-start;width:min(884px,100%);margin:auto}footer{padding:0 24px 16px;font-size:12px;color:#59675d}@media(max-width:800px){header{align-items:flex-start;flex-direction:column;padding:12px}.bar{padding:10px 12px}.stage{padding:0 10px 12px}iframe{min-height:500px}.mobile{padding:0 10px 12px}nav button{padding:7px 10px}.bar span{max-width:45%}}</style>
<header><div><h1>島嶼桌遊 · 代表畫面提案</h1><p>獨立視覺原型｜沿用現有插畫與卡牌數值｜未連接正式遊戲</p></div><nav aria-label="代表畫面"><button data-scene="cards" aria-pressed="true">卡牌設計</button><button data-scene="story" aria-pressed="false">序章對話</button><button data-scene="battle" aria-pressed="false">2.5D 戰場</button></nav></header>
<div class="bar"><nav aria-label="預覽尺寸"><button id="desktop" aria-pressed="true">桌面</button><button id="mobile" aria-pressed="false">手機橫向 · 844 × 390</button></nav><span id="hint">可點選卡片、翻面；數值是靜態展示。</span></div>
<div class="stage" id="stage"><iframe id="frame" src="screen-v1.html?scene=cards" title="卡牌代表畫面"></iframe></div><footer>此頁的購買、部署與開戰按鈕僅展示操作位置，不會執行遊戲或寫入存檔。桌面戰場也可點卡面開啟查看器。</footer>
<script>let scene='cards';const frame=document.getElementById('frame');document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;frame.src='screen-v1.html?scene='+scene;frame.title=b.textContent+'代表畫面';document.querySelectorAll('[data-scene]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('hint').textContent=scene==='story'?'可比較短句與長句；對話框跟隨內容高度。':'可點選卡片、翻面；數值是靜態展示。'});for(const mode of ['desktop','mobile'])document.getElementById(mode).onclick=()=>{document.getElementById('stage').classList.toggle('mobile',mode==='mobile');for(const m of ['desktop','mobile'])document.getElementById(m).setAttribute('aria-pressed',m===mode)};</script></html>
